[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ptm-ipf"
version = "0.2.0"
description = "EBSD-style inverse pole figure colouring and pole figures for atomistic simulations, from OVITO polyhedral template matching"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = [
    "molecular-dynamics", "crystallography", "inverse-pole-figure", "ebsd",
    "ovito", "polyhedral-template-matching", "texture", "magnesium", "hcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "matplotlib>=3.5",
    # OVITO's compiled bindings are built against one Qt: 3.16 pins
    # PySide6~=6.10.3, but 3.15.5 accepts any PySide6>=6.8.3 and then fails to
    # load against a newer one.  There is no 3.16 wheel for Python 3.14 on
    # Windows, so that combination is refused here rather than installed and
    # found broken later.
    "ovito>=3.7; python_version < '3.14'",
    "ovito>=3.16; python_version >= '3.14'",
]

[project.optional-dependencies]
test = ["pytest>=7", "ase>=3.22", "orix>=0.11", "imageio[ffmpeg]"]
video = ["imageio[ffmpeg]"]
examples = ["ase>=3.22"]

[project.scripts]
ptmipf = "ptmipf.cli:main"
ptmipf-ui = "ptmipf.webui:main"
ptmipf-example = "ptmipf.examples:main"

[tool.setuptools.packages.find]
include = ["ptmipf*"]

[tool.setuptools.package-data]
# The web UI ships its front end (HTML/CSS/JS) inside the package.
ptmipf = ["webui/static/*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Crystallographic index names (h, k, l) are clearer than the alternatives.
"ptmipf/polefigure.py" = ["E741"]
# Imports follow pytest.importorskip, which must run first.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
